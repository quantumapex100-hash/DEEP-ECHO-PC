<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEEP-ECHO Mini</title><link rel="stylesheet" href="mini.css"></head>
<body data-theme="golden">
  <div class="mini-shell">
    <div class="drag-bar"><span>DINECHO MINI</span><button id="closeBtn" aria-label="Close">×</button></div>
    <div class="mini-main">
      <img id="miniArt" src="assets/dinecho-logo.png" alt="">
      <div class="mini-meta"><strong id="miniTitle">Nothing playing</strong><span id="miniArtist"></span><div class="mini-progress"><i id="miniFill"></i></div></div>
      <div class="mini-controls"><button id="back10Btn" class="seek10" title="Back 10 seconds" aria-label="Back 10 seconds">↶<small>10</small></button><button id="prevBtn" title="Previous" aria-label="Previous song">◀</button><button id="playBtn" class="play" title="Play/Pause" aria-label="Play or pause">▶</button><button id="nextBtn" title="Next" aria-label="Next song">▶</button><button id="forward10Btn" class="seek10" title="Forward 10 seconds" aria-label="Forward 10 seconds">↷<small>10</small></button></div>
    </div>
    <div id="miniTime" class="mini-time">0:00 / 0:00</div>
  </div>
<script src="mini.js"></script></body></html>
