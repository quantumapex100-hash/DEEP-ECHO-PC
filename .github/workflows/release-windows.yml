name: Build and publish DEEP-ECHO 2.2 END

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deep-echo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REPO: windowsdaiyu-cyber/DEEP-ECHO-Releases
      RELEASE_TITLE: 2.2 END

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify release inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Missing RELEASE_TOKEN repository secret.'
          }
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag v$tagVersion does not match package.json version $packageVersion"
          }
          if ($packageVersion -ne '2.2.8') {
            throw "2.2 END must ship as semantic version 2.2.8, found $packageVersion"
          }
          gh api "repos/$env:RELEASE_REPO" --jq '.full_name' | Out-Null

      - name: Cache Electron build tools
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bundle latest yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $nightly = 'https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe'
          $stable = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe'
          try {
            Invoke-WebRequest -Uri $nightly -OutFile 'bin/yt-dlp.exe' -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri $stable -OutFile 'bin/yt-dlp.exe' -UseBasicParsing
          }
          if (-not (Test-Path 'bin/yt-dlp.exe')) { throw 'yt-dlp download failed' }

      - name: Run complete automated test suite
        run: npm test

      - name: Build and publish installer
        run: npm run release

      - name: Finalize GitHub release title and notes
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tag = "v$packageVersion"
          gh release edit $tag --repo $env:RELEASE_REPO --title $env:RELEASE_TITLE --notes-file RELEASE-NOTES-2.2-END.md --latest
          $view = gh release view $tag --repo $env:RELEASE_REPO --json name,tagName,url,assets,publishedAt,isDraft,isPrerelease | ConvertFrom-Json
          $latestTag = gh api "repos/$env:RELEASE_REPO/releases/latest" --jq ".tag_name"
          if ($latestTag -ne $tag) { throw "Release $tag exists but is not the latest release. Latest is $latestTag" }
          if ($view.name -ne $env:RELEASE_TITLE) { throw "Release title mismatch: expected $env:RELEASE_TITLE, got $($view.name)" }
          if (-not ($view.assets.name -contains "DEEP-ECHO-$packageVersion-Setup.exe")) { throw "Installer asset missing from release." }
          if (-not ($view.assets.name -contains "latest.yml")) { throw "latest.yml missing from release." }
          Write-Host "Release verified: $($view.name) [$($view.tagName)]"
          Write-Host "Latest endpoint: $latestTag"
          Write-Host "URL: $($view.url)"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deep-echo-2.2-end-build-debug
          path: |
            dist/**
            builder-debug.yml
            builder-effective-config.yaml
          if-no-files-found: ignore
